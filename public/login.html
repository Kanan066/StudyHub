<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - StudyHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("studyhub-theme") || "light";</script>
</head>
<body>
  <section class="card auth">
    <h1><a href="index.html" class="home">StudyHub</a></h1>
    <p class="meta">Plan your tasks and study time in one place.</p>
    <form id="authForm" novalidate>
      <input id="aName" placeholder="Your name" autocomplete="name" aria-label="Name" hidden>
      <input id="aEmail" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
      <input id="aPass" type="password" placeholder="Password (6+ characters)" aria-label="Password">
      <button id="authSubmit" type="submit">Log in</button>
      <p class="error" id="authError" role="alert"></p>
    </form>
    <button id="authToggle" class="ghost" type="button"></button>
  </section>
  <script src="auth.js"></script>
</body>
</html>
